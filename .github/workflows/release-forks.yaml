name: Release (forks)

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-artifacts:
    uses: ./.github/workflows/build.yaml

  release:
    runs-on: macos-latest
    if: github.repository != 'electron-userland/electron-builder-binaries'
    needs: build-artifacts
    permissions:
      contents: write      # push changeset-release/master branch
      pull-requests: write # open/update the version PR
    timeout-minutes: 15
    steps:
      - name: Enable Corepack for pnpm
        run: |
          corepack enable
        shell: bash

      - name: Checkout code repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download new artifacts
        id: download-artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-artifacts.outputs.artifactId }}

      - name: Install tree for displaying structure
        run: |
          brew install tree
          mkdir -p artifacts-staging

      - name: Display structure of previously built artifacts
        run: |
          tree artifacts-staging

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Create versions PR & prepare publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: "pnpm ci:version"
          publish: "pnpm ci:publish"
          commit: 'chore(deploy): Release'
          title: 'chore(deploy): Release'
          setupGitUser: true
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create scoped releases
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Releases created with tags: ${{ steps.changesets.outputs.publishedPackages }}"
          node scripts/changeset-publish.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
